<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>E2 · Music Box Paper · indigo on ivory</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Same paper-roll structure as E, in a cooler navy / ivory palette */
        :root { --paper:#f1eee3; --paper-2:#e6e2d3; --ink:#1a1a2c; --ink-2:#3a3a55; --ink-3:#7a7a8d; --hole:#1a1a2c; --warm:#3845a6; }
        * { box-sizing: border-box; image-rendering: pixelated; }
        body { margin: 0; background: var(--paper-2); color: var(--ink); font-family: 'Pixelify Sans', monospace; min-height: 100vh; padding: 1.5rem 1rem; }
        .stage { max-width: 50rem; margin: 0 auto; }
        .topbar { display: flex; justify-content: space-between; padding-bottom: 0.6rem; border-bottom: 2px solid var(--ink); font-family: 'VT323', monospace; font-size: 1.2rem; margin-bottom: 1.2rem; }
        .topbar a { color: var(--ink); text-decoration: none; }
        h1 { font-size: 2rem; margin: 0 0 0.4rem; font-weight: 700; letter-spacing: 0.04em; }
        .sub { font-family: 'VT323', monospace; font-size: 1.2rem; color: var(--ink-3); margin: 0 0 1.5rem; }

        /* The paper roll itself — beige strip with punched holes */
        .roll {
            background: var(--paper);
            border: 2px solid var(--ink);
            padding: 1.2rem 1rem 0.8rem;
            margin-bottom: 1.3rem;
            position: relative;
            box-shadow: 4px 4px 0 var(--warm);
        }
        .roll-top, .roll-bottom {
            display: flex; justify-content: space-around; align-items: center;
            padding: 0.2rem 0;
        }
        .roll-top { border-bottom: 1px dashed var(--ink-3); margin-bottom: 0.6rem; }
        .roll-bottom { border-top: 1px dashed var(--ink-3); margin-top: 0.6rem; }
        .feed-hole { width: 8px; height: 8px; background: var(--hole); border-radius: 50%; }
        .roll-staff {
            display: grid; grid-template-columns: repeat(24, 1fr); gap: 4px;
            padding: 0.4rem 0; min-height: 80px;
        }
        .roll-staff .col {
            display: flex; flex-direction: column; gap: 3px; align-items: center;
        }
        .roll-staff .dot { width: 7px; height: 7px; background: var(--hole); border-radius: 50%; }
        .roll-staff .empty { width: 7px; height: 7px; background: transparent; border: 1px dotted var(--ink-3); border-radius: 50%; }
        .roll-staff .col.playing .dot { background: var(--warm); box-shadow: 0 0 0 3px rgba(160,106,58,0.18); }
        .roll-staff .col.playing { background: rgba(160,106,58,0.06); }

        .now-label { font-family: 'VT323', monospace; font-size: 1.1rem; color: var(--warm); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 0.4rem; }
        .now-title { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.6rem; }
        .now-meta { display: flex; justify-content: space-between; font-family: 'VT323', monospace; font-size: 1.1rem; color: var(--ink-3); }

        .ctrls { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .btn {
            font-family: 'VT323', monospace; font-size: 1.3rem;
            background: var(--paper); color: var(--ink);
            border: 2px solid var(--ink); padding: 0.3rem 0.9rem; cursor: pointer;
            letter-spacing: 0.06em;
        }
        .btn:hover { background: var(--ink); color: var(--paper); }
        .speed { display: inline-flex; align-items: center; gap: 0.5rem; font-family: 'VT323', monospace; font-size: 1.1rem; color: var(--ink-2); }
        .speed input[type="range"] { accent-color: var(--warm); width: 100px; }
        #speed-out { color: var(--warm); min-width: 3.4em; text-align: right; }

        .list { background: var(--paper); border: 2px solid var(--ink); padding: 1rem 1.2rem; box-shadow: 4px 4px 0 var(--ink-3); }
        .list h2 { font-size: 1.1rem; margin: 0 0 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--ink-3); letter-spacing: 0.04em; }
        .row { display: grid; grid-template-columns: 2rem 1fr auto auto; gap: 0.8rem; align-items: baseline; padding: 0.5rem 0; font-family: 'VT323', monospace; font-size: 1.2rem; border-bottom: 1px dotted var(--ink-3); }
        .row:last-child { border-bottom: 0; }
        .row .n { color: var(--warm); }
        .row .name { color: var(--ink); }
        .row .holes { color: var(--ink-3); font-size: 1rem; }
        .row .len { color: var(--ink-3); font-size: 1rem; }
        .row { cursor: pointer; }
        .row:hover { background: var(--paper-2); }
        .row.active { background: rgba(160,106,58,0.12); }
        .row.active .name { color: var(--warm); font-weight: 700; }
    </style>
</head>
<body>
    <div class="stage">
        <header class="topbar">
            <a href="index.html">← samples</a>
            <span>E2 · MUSIC BOX · INDIGO</span>
        </header>

        <h1>音乐</h1>
        <p class="sub">music box paper · holes that sing</p>

        <section class="roll">
            <p class="now-label">▼ now playing</p>
            <p class="now-title">千与千寻 · あの夏へ</p>
            <div class="roll-top">
                <span class="feed-hole"></span><span class="feed-hole"></span><span class="feed-hole"></span>
                <span class="feed-hole"></span><span class="feed-hole"></span><span class="feed-hole"></span>
                <span class="feed-hole"></span><span class="feed-hole"></span><span class="feed-hole"></span>
            </div>
            <div class="roll-staff" id="roll-staff"></div>
            <div class="roll-bottom">
                <span class="feed-hole"></span><span class="feed-hole"></span><span class="feed-hole"></span>
                <span class="feed-hole"></span><span class="feed-hole"></span><span class="feed-hole"></span>
                <span class="feed-hole"></span><span class="feed-hole"></span><span class="feed-hole"></span>
            </div>
            <p class="now-meta"><span id="now-time">00:53 / 02:14</span><span>30 孔纸带 · 真孔位</span></p>
            <div class="ctrls">
                <button class="btn" id="btn-play">▶ 摇</button>
                <button class="btn" id="btn-stop">■ 停</button>
                <button class="btn" id="btn-wish">♥ 许愿</button>
                <label class="speed">
                    <span>速度</span>
                    <input id="speed" type="range" min="40" max="200" value="100" />
                    <span id="speed-out">1.00×</span>
                </label>
            </div>
        </section>

        <section class="list">
            <h2>曲目册</h2>
            <div class="row" data-id="0"><span class="n">01</span><span class="name">千与千寻 · あの夏へ</span><span class="holes">30 孔</span><span class="len">2:14</span></div>
            <div class="row" data-id="1"><span class="n">02</span><span class="name">天空之城</span><span class="holes">30 孔</span><span class="len">2:55</span></div>
            <div class="row" data-id="2"><span class="n">03</span><span class="name">城南旧事</span><span class="holes">30 孔</span><span class="len">2:08</span></div>
            <div class="row" data-id="3"><span class="n">04</span><span class="name">Remember Me（Coco）</span><span class="holes">30 孔</span><span class="len">1:50</span></div>
            <div class="row" data-id="4"><span class="n">05</span><span class="name">Saria's Theme</span><span class="holes">15 孔</span><span class="len">1:38</span></div>
        </section>
        <p style="margin-top:1.5rem;font-family:'VT323',monospace;font-size:1.05rem;color:var(--ink-3);">
            * 这一版纸带孔位是手工写的样板。下一版能接你的 MIDI / 打孔 PDF，让每首曲子的孔位真实对应原曲。
        </p>
    </div>
    <script>
        // Per-song hole patterns (placeholder — to be replaced with real MIDI data).
        // Each pattern is an array of column values; value = pitch row (1=low, 6=high), 0=rest.
        const SONGS = [
            { name: '千与千寻 · あの夏へ', pattern: [3,5,3,1,3,5,6,5,3,5,3,1,4,2,5,3,1,3,4,2,3,5,1,3,5,3,1,4,2,5,3,1,3,4,2,3] },
            { name: '天空之城',            pattern: [5,3,1,3,5,6,5,3,1,2,3,5,3,2,1,2,3,1,5,3,1,3,5,6,5,3,1,2,3,5,3,2,1,2,3,1] },
            { name: '城南旧事',            pattern: [4,2,5,3,1,4,2,5,3,1,3,5,6,4,2,3,1,2,4,2,5,3,1,4,2,5,3,1,3,5,6,4,2,3,1,2] },
            { name: 'Remember Me',         pattern: [3,1,5,3,1,3,5,1,3,5,6,4,2,3,5,1,3,5,3,1,5,3,1,3,5,1,3,5,6,4,2,3,5,1,3,5] },
            { name: "Saria's Theme",       pattern: [5,3,5,6,5,3,1,3,5,3,5,6,5,3,1,3,5,3,5,3,5,6,5,3,1,3,5,3,5,6,5,3,1,3,5,3] },
        ];
        const ROWS = 6;
        const staff = document.getElementById('roll-staff');
        const speedInput = document.getElementById('speed');
        const speedOut = document.getElementById('speed-out');
        const nowTitle = document.querySelector('.now-title');
        let currentSong = 0;
        let playing = false;
        let playhead = 0;
        let timer = null;

        function renderRoll(pattern) {
            staff.innerHTML = '';
            pattern.forEach((pitch, c) => {
                const col = document.createElement('div');
                col.className = 'col';
                col.dataset.col = c;
                for (let r = 0; r < ROWS; r++) {
                    const dot = document.createElement('span');
                    dot.className = (r === ROWS - pitch && pitch > 0) ? 'dot' : 'empty';
                    col.appendChild(dot);
                }
                staff.appendChild(col);
            });
        }

        function highlightPlayhead(idx) {
            staff.querySelectorAll('.col').forEach((c, i) => {
                c.classList.toggle('playing', i === idx);
            });
        }

        function selectSong(i) {
            currentSong = i;
            const s = SONGS[i];
            nowTitle.textContent = s.name;
            renderRoll(s.pattern);
            stopPlay();
            document.querySelectorAll('.row').forEach(r => r.classList.toggle('active', Number(r.dataset.id) === i));
        }

        function stepInterval() {
            const spd = Number(speedInput.value) / 100;
            return Math.max(50, 220 / spd);
        }
        function startPlay() {
            playing = true;
            const tick = () => {
                if (!playing) return;
                highlightPlayhead(playhead);
                playhead = (playhead + 1) % SONGS[currentSong].pattern.length;
                timer = setTimeout(tick, stepInterval());
            };
            tick();
        }
        function stopPlay() {
            playing = false;
            playhead = 0;
            if (timer) clearTimeout(timer);
            highlightPlayhead(-1);
        }

        speedInput.addEventListener('input', () => { speedOut.textContent = (speedInput.value/100).toFixed(2) + '×'; });
        document.getElementById('btn-play').addEventListener('click', () => { stopPlay(); startPlay(); });
        document.getElementById('btn-stop').addEventListener('click', stopPlay);
        document.getElementById('btn-wish').addEventListener('click', () => {
            const wish = prompt('许个曲子吧——告诉我你想听 ReBone 把哪首做成八音盒版？');
            if (wish && wish.trim()) alert('记下了：' + wish.trim() + '\n（这是 sample；实际版本会发到邮箱）');
        });
        document.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => selectSong(Number(r.dataset.id))));
        selectSong(0);
    </script>
</body>
</html>
