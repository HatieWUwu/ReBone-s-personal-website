                <h2>封存的内容</h2>
                <p>这份说明之外还有一些没有放在公开页面上——个人珍藏（喜欢的歌、物件、梦境）和私人经历。它们不在网站源码里，也不会被搜索到。如果你的处境真的需要，或我们之间已经有信任，写下你的情况，我看到之后会私下回到你。</p>
                <form id="apple-request-form" class="apple-request">
                    <label class="apple-request-label" for="apple-request-text">你的情况 / 想说的</label>
                    <textarea id="apple-request-text" class="apple-request-input" rows="5" placeholder="不用很长，关键的几句就好。"></textarea>

                    <div class="apple-request-actions">
                        <button id="apple-request-submit" type="button" class="letterbox-button">申请阅读</button>
                        <span id="apple-request-status" class="letterbox-status"></span>
                    </div>
                </form>
            </section>
