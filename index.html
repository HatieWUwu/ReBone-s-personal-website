<body>
    <nav class="banner">
        <div class="banner-inner">
            <a href="index.html" class="brand">ReBone</a>
            <div class="nav-links">
                <a href="solutions.html" class="nav-link">Solutions</a>
                <a href="expressions.html" class="nav-link">Expressions</a>
                <a href="reflections.html" class="nav-link">Reflections</a>
                <a href="readme.html" class="nav-link">README.md</a>
            </div>
        </div>
    </nav>

    <main id="home-content-root" class="shell">
        <aside id="home-rail" class="rail">
            <!-- populated by renderHomeRail -->
        </aside>

        <div class="shell-gutter" aria-hidden="true"></div>

        <div class="main">
            <section id="front" class="page-hero">
                <p class="page-eyebrow">— 前言</p>
                <h1 id="home-heading" class="page-heading"></h1>
                <p id="home-intro-label" class="intro-label"></p>
                <ol id="home-intro-points" class="intro-points"></ol>
            </section>

            <section id="sections">
                <div id="home-links"></div>
            </section>

            <section id="updates" class="panel">
                <h3 class="panel-head">
                    <span id="updates-label">更新</span>
                </h3>
                <div id="updates-list"></div>
                <div id="updates-more" class="updates-more" style="display:none"></div>
            </section>

            <section id="inbox" class="panel letterbox-panel">
                <h3 class="panel-head">
                    <span id="inbox-title">匿名提问箱</span>
                    <a id="inbox-archive-link" href="inbox.html">查看公开提问箱 ↗</a>
                </h3>
                <p id="inbox-intro" class="letterbox-strip"></p>
                <textarea id="inbox-draft" class="letterbox-input" placeholder=""></textarea>
                <div class="letterbox-meta">
                    <span id="inbox-visibility-label" class="letterbox-meta-label">可见性</span>
                    <label id="inbox-visibility-public" class="letterbox-radio">
                        <input type="radio" name="inbox-visibility" value="public" checked />
                        <span>公开</span>
                    </label>
                    <label id="inbox-visibility-private" class="letterbox-radio">
                        <input type="radio" name="inbox-visibility" value="private" />
                        <span>不公开</span>
                    </label>
                </div>
                <div id="inbox-contact-row" class="letterbox-contact" style="display:none">
                    <label id="inbox-contact-label" for="inbox-contact" class="letterbox-meta-label">回信渠道</label>
                    <input id="inbox-contact" type="text" class="letterbox-contact-input" />
                </div>
                <div class="letterbox-actions">
                    <button id="inbox-button" type="button" class="letterbox-button">投递</button>
                    <span id="inbox-status" class="letterbox-status"></span>
                </div>
            </section>

            <div id="home-credits"></div>
        </div>
    </main>

    <footer class="site-footer">© 2025–2026 ReBone. 保留所有权利。</footer>
</body>
</html>
